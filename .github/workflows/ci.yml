# Каждая правка проходит проверки на macOS, Linux и Windows (нативно, без WSL).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python unit tests (UTF-8 mode)
        run: python -X utf8 -m unittest discover -s skills/aimaster/scripts -p "test_*.py"

      - name: Python unit tests (Windows console encoding, no UTF-8 mode)
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "0"
        run: python -m unittest discover -s skills/aimaster/scripts -p "test_*.py"

      - name: Compile all Python sources
        run: python -m compileall -q skills/aimaster

      - name: Dashboard unit tests (node --test)
        shell: bash
        run: node --test skills/aimaster/studio/static/ui/v2/*.test.mjs

      - name: Static ES modules parse
        run: node --experimental-vm-modules --no-warnings skills/aimaster/scripts/check_static_modules.mjs

      - name: Clean-machine smoke (install + autopilot + server)
        env:
          PYTHONUTF8: "0"
        run: python skills/aimaster/scripts/smoke_clean_machine.py

  montage-engine:
    name: montage · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      # Браузер — только из записи установщика. Переменная указывает в никуда:
      # зелёная установка показывает, что установщик её не читает, зелёный
      # рендер — что до движка она не доходит (engine_env ставит свою).
      HYPERFRAMES_BROWSER_PATH: /nonexistent/ignored-by-aimaster/chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install pinned HyperFrames, render browser and skills
        # Папка движка на Windows — в «AI Мастерская» (кириллица и пробел): на
        # таком пути встроенная распаковка .zip в @puppeteer/browsers даёт
        # пустую папку браузера (проверено на CI рядом с ASCII-путём; причина
        # внутри чужого распаковщика не установлена). Поэтому на Windows
        # chrome-headless-shell качает и распаковывает сам установщик
        # (install_montage_browser_win.preseed). Системный Chrome не подходит:
        # `chrome.exe --version` на Windows не отвечает.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python skills/aimaster/scripts/install_montage.py --json > montage-install.json || true
          cat montage-install.json
          python -c "import json,sys; r=json.load(open('montage-install.json',encoding='utf-8')); sys.exit(0 if r['ok'] and r['skills']['status'] in ('found', 'installed') else 1)"

      # shell: bash — это `bash -eo pipefail`: без pipefail tee спрятал бы код выхода проверки.
      - name: Render the skill's draft with a Cyrillic title, ffprobe, no external URLs, no network traces
        shell: bash
        run: python skills/aimaster/scripts/montage_ci_check.py --json | tee montage-online.json

      - name: Montage end-to-end on the real engine (draft, render, edit, diff, foreign font, gsap, restore, desk)
        env:
          AIMASTER_REQUIRE_ENGINE: "1"
        run: python -m unittest discover -s skills/aimaster/scripts -p "test_montage_e2e.py" -v

      - name: Clean-machine smoke with the installed engine (montage draft, render v001)
        run: python skills/aimaster/scripts/smoke_clean_machine.py --with-engine

      - name: Render without network (Linux, empty network namespace)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net -- bash -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups env PATH=\"$PATH\" HOME=\"$HOME\" PYTHONUTF8=1 python skills/aimaster/scripts/montage_ci_check.py --json --offline" | tee montage-offline.json

      - name: Same video with and without network (Linux)
        if: runner.os == 'Linux'
        run: |
          python -c "import json; a, b = (json.load(open(n, encoding='utf-8')) for n in ('montage-online.json', 'montage-offline.json')); assert a['video_md5'] and a['video_md5'] == b['video_md5'], (a.get('video_md5'), b.get('video_md5')); print('video_md5', a['video_md5'])"
