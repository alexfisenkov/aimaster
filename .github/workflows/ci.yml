# Каждая правка проходит проверки на macOS, Linux и Windows (нативно, без WSL).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python unit tests (UTF-8 mode)
        run: python -X utf8 -m unittest discover -s skills/aimaster/scripts -p "test_*.py"

      - name: Python unit tests (Windows console encoding, no UTF-8 mode)
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "0"
        run: python -m unittest discover -s skills/aimaster/scripts -p "test_*.py"

      - name: Compile all Python sources
        run: python -m compileall -q skills/aimaster

      - name: Dashboard unit tests (node --test)
        shell: bash
        run: node --test skills/aimaster/studio/static/ui/v2/*.test.mjs

      - name: Static ES modules parse
        run: node --experimental-vm-modules --no-warnings skills/aimaster/scripts/check_static_modules.mjs

      - name: Clean-machine smoke (install + autopilot + server)
        env:
          PYTHONUTF8: "0"
        run: python skills/aimaster/scripts/smoke_clean_machine.py

  montage-engine:
    name: montage · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install pinned HyperFrames, render browser and skills
        # round 2/5, владелец, 2026-09-25 (H1, run 36141827389, джобы «H1
        # experiment · ascii/cyrillic» в одном пуше): не-ASCII путь движка
        # («AI Мастерская») даёт пустую версийную папку у встроенной Windows-
        # распаковки .zip в @puppeteer/browsers — тот же .zip, ASCII-путь
        # рядом отработал целиком. Причина внутри чужого распаковщика не
        # установлена (закрытый бинарник tar.exe/powershell.exe) — доказан
        # только сам факт. Исправлено в install_montage_browser_win.py::
        # preseed (качает и распаковывает chrome-headless-shell сами,
        # Unicode-safe). Системный Chrome (round 1/5) и HYPERFRAMES_BROWSER_
        # PATH здесь больше не нужны — H2 тем же прогоном (шаг H2 experiment)
        # показал, что `chrome.exe --version` на Windows не отвечает вовсе
        # (запускает полноценный браузер вместо короткого ответа) —
        # системный GUI-Chrome для CI непригоден в принципе, убран целиком.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python skills/aimaster/scripts/install_montage.py --json > montage-install.json || true
          cat montage-install.json
          python -c "import json,sys; r=json.load(open('montage-install.json',encoding='utf-8')); sys.exit(0 if r['ok'] and r['skills']['status'] in ('found', 'installed') else 1)"

      - name: Render a 3-second clip, ffprobe, no external URLs, no network traces
        run: python skills/aimaster/scripts/montage_ci_check.py --json

      - name: Render without network (Linux, empty network namespace)
        if: runner.os == 'Linux'
        run: |
          sudo unshare --net -- bash -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups env PATH=\"$PATH\" HOME=\"$HOME\" PYTHONUTF8=1 python skills/aimaster/scripts/montage_ci_check.py --json --offline"
